<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('spendwise-theme') || 'light'; } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #174C3C;
      --surface: #FFFFFF; --surface-2: #F6F5EF; --line: #E6E3D7;
      --text: #202C27; --muted: #66736C;
      --primary: #174C3C; --primary-soft: #E3ECE3;
      --accent: #174C3C; --accent-dark: #0F3529; --accent-text: #8A6A2F;
      --gold: #D6B77A; --danger: #A8533E;
    }
    [data-theme="dark"] {
      --bg: #0C1B16;
      --surface: #13291F; --surface-2: #19352A; --line: #23423A;
      --text: #F3F1E8; --muted: #A7B5AC;
      --primary: #2E7A5E; --primary-soft: #1D3C31;
      --accent: #2E7A5E; --accent-dark: #3A8C6D; --accent-text: #D6B77A;
      --danger: #E0937C;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); }
    .card { width: min(390px, 92vw); background: var(--surface); border-radius: 22px; padding: 34px; box-shadow: 0 30px 70px rgba(5, 20, 15, 0.45); animation: pop-in .5s cubic-bezier(.5,1.5,.5,1); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: none; } }
    .brand { display: flex; align-items: center; gap: 10px; font-family: Manrope, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -1px; margin-bottom: 26px; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--gold); }
    .brand span { font-weight: 500; color: var(--accent-text); }
    h1 { font-family: Manrope, sans-serif; font-size: 26px; letter-spacing: -.8px; margin: 0 0 6px; }
    .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--muted); }
    input { display: block; width: 100%; margin-top: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font: inherit; color: var(--text); background: var(--surface-2); }
    input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
    button { width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin-top: 4px; box-shadow: 0 10px 24px rgba(23, 76, 60, .3); transition: transform .15s, background .15s; }
    button:hover { background: var(--accent-dark); transform: translateY(-2px); }
    button:disabled { opacity: 0.6; cursor: wait; transform: none; }
    .error { min-height: 20px; color: var(--danger); font-size: 13px; margin: 0 0 8px; }
    .hint { font-size: 12px; font-weight: 400; color: var(--muted); }
    .switch { text-align: center; font-size: 14px; color: var(--muted); margin: 18px 0 0; }
    .switch a { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>
  <form class="card" id="auth-form">
    <div class="brand"><span class="brand-mark"></span><div>spend<span>wise</span></div></div>
    <h1 id="title">Welcome back</h1>
    <p class="subtitle" id="subtitle">Log in to see your dashboard.</p>
    <label>Username
      <input name="username" autocomplete="username" required minlength="3" maxlength="30" />
    </label>
    <label>Password <span class="hint" id="password-hint" hidden>(at least 8 characters)</span>
      <input name="password" type="password" autocomplete="current-password" required minlength="8" />
    </label>
    <p class="error" id="error" role="alert"></p>
    <button type="submit" id="submit-button">Log in</button>
    <p class="switch"><span id="switch-text">New here?</span> <a href="#" id="switch-link">Create an account</a></p>
  </form>

  <script>
    let mode = 'login'; // or 'signup'
    const form = document.querySelector('#auth-form');
    const errorText = document.querySelector('#error');
    const submitButton = document.querySelector('#submit-button');

    document.querySelector('#switch-link').addEventListener('click', event => {
      event.preventDefault();
      mode = mode === 'login' ? 'signup' : 'login';
      const isLogin = mode === 'login';
      document.querySelector('#title').textContent = isLogin ? 'Welcome back' : 'Create your account';
      document.querySelector('#subtitle').textContent = isLogin ? 'Log in to see your dashboard.' : 'Start tracking your money in seconds.';
      submitButton.textContent = isLogin ? 'Log in' : 'Sign up';
      document.querySelector('#switch-text').textContent = isLogin ? 'New here?' : 'Already have an account?';
      event.target.textContent = isLogin ? 'Create an account' : 'Log in';
      document.querySelector('#password-hint').hidden = isLogin;
      form.elements.password.autocomplete = isLogin ? 'current-password' : 'new-password';
      errorText.textContent = '';
    });

    form.addEventListener('submit', async event => {
      event.preventDefault();
      errorText.textContent = '';
      submitButton.disabled = true;
      try {
        const res = await fetch(`/api/${mode}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: form.elements.username.value, password: form.elements.password.value })
        });
        if (res.ok) { window.location.href = '/'; return; }
        const data = await res.json().catch(() => ({}));
        errorText.textContent = data.error || 'Something went wrong. Please try again.';
      } catch {
        errorText.textContent = 'Cannot reach the server. Is "python main.py" running?';
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
